services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EVENT_MOSAIC_POSTGRES_DB:-event_mosaic}
      POSTGRES_PASSWORD: ${EVENT_MOSAIC_POSTGRES_PASSWORD:?EVENT_MOSAIC_POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${EVENT_MOSAIC_POSTGRES_USER:-event_mosaic}
    ports:
      - "${EVENT_MOSAIC_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: ${EVENT_MOSAIC_ES_JAVA_OPTS:-"-Xms1g -Xmx1g"}
    ports:
      - "${EVENT_MOSAIC_ELASTICSEARCH_HTTP_PORT:-9200}:9200"
      - "${EVENT_MOSAIC_ELASTICSEARCH_TRANSPORT_PORT:-9300}:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

volumes:
  postgres-data:
  elasticsearch-data:
