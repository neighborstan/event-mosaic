spring:
  application:
    name: event-mosaic
  datasource:
    hikari:
      connection-timeout: 30000
      data-source-properties:
        connectTimeout: 10
        socketTimeout: 45
        cancelSignalTimeout: 5
  jdbc:
    template:
      query-timeout: 30s
  flyway:
    locations: classpath:db/migration
    validate-migration-naming: true
  docker:
    compose:
      enabled: true
      file: compose.local.yml

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      status:
        order: down,out-of-service,degraded,unknown,up
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,elasticsearch,staging
        pipeline:
          include: backendDataPipeline
          show-details: always

event-mosaic:
  backend-data:
    partition-interval: P7D
    retry:
      initial-delay: 1m
      multiplier: 2.0
      maximum-delay: 15m
      jitter-ratio: 0.1
      automatic-retry-limit: 3
    operation-deadline: 12m
    receipt-page-size: 500
    disk-pressure:
      staging-min-free-bytes: 1073741824
      elasticsearch-min-free-bytes: 2147483648
    rebuild:
      plan-ttl: 15m
      ownership-lease: 15m
    cleanup:
      orphan-building-age: 24h
      superseded-age: 7d
      plan-ttl: 15m
      ownership-lease: 15m
      automatic-deletion-enabled: false
  search:
    max-sources-per-event: 20
  map:
    country-snapshot:
      geometry-version: country-v1
      ingestion-grace: 15m
  indexing:
    bulk-size: 500
    max-bulk-bytes: 5242880
    request-timeout: 2m
  gdelt:
    csv:
      max-record-chars: 1048576
  ingestion:
    gdelt:
      base-uri: https://storage.googleapis.com/data.gdeltproject.org/gdeltv2/
      staging-root: .local/gdelt
      http:
        max-manifest-bytes: 65536
        max-archive-bytes: 536870912
        connect-timeout: 10s
        request-timeout: 2m
      zip:
        max-entries: 4
        max-entry-bytes: 1073741824
        max-total-bytes: 1073741824
      continuity:
        recovery-lease: 15m
        first-run-policy: RECENT_WINDOW
      automatic:
        enabled: false
        poll-delay: 1m
        cycle-lease: 15m
        shutdown-grace: 30s
        scheduler-stale-base: 5m
        source-outage-threshold: 30m
        due-work-limit: 256
        receipt-audit:
          interval: 15m
          batch-size: 2
      one-shot-enabled: false
